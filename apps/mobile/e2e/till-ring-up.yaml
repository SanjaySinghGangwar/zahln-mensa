# Till: sign in as a cashier, ring up one dish and show the QR.
# Run: maestro --device <tablet> test e2e/till-ring-up.yaml
appId: de.zahln.mensa
---
- launchApp:
    clearState: true
- tapOn: "English"
- tapOn: "cashier-campus-1"
- scrollUntilVisible:
    element:
      id: "login-submit"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "Menu"
    timeout: 60000
- tapOn:
    text: "Add one .*"
    index: 0
- scrollUntilVisible:
    element:
      id: "ring-up"
- tapOn:
    id: "ring-up"
- extendedWaitUntil:
    visible: "Scan with the Zahln app to pay"
    timeout: 60000
